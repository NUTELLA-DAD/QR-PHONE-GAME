<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Airship Crew - Build test</title>
<style>
  /* Bundled fonts (no internet needed). Limelight = titles/numbers, Libre Baskerville = labels/body. */
  @font-face{font-family:'Limelight';src:url(/fonts/Limelight-Regular.ttf) format('truetype');font-weight:400;font-display:block}
  @font-face{font-family:'Libre Baskerville';src:url(/fonts/LibreBaskerville.ttf) format('truetype');font-weight:400 700;font-display:block}
  /* Captain's logbook look: cream paper, warm-brown ink (the colours are set from config.LOGBOOK / config.FONTS by buildTest.js). */
  :root{--paper:#f3ead6;--shade:#e4d7b8;--ink:#3a2c20;--soft:#6b4a32;--pin:#c9a85a;--stamp:#a8443f;--display:'Limelight',Georgia,serif;--text:'Libre Baskerville',Georgia,serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#2b1d14;color:var(--ink);font:13px var(--text)}
  #app{display:grid;grid-template-columns:310px 1fr;grid-template-rows:auto 1fr auto;height:100%;gap:8px;padding:8px}
  .panel{background:var(--paper);border:3px solid var(--ink);border-radius:10px;box-shadow:4px 5px 0 rgba(43,34,22,.35),inset 0 0 0 4px var(--paper),inset 0 0 0 5px rgba(107,74,50,.45);padding:12px 14px;min-height:0}
  h1,h2{font-family:var(--display);font-weight:400;margin:0 0 6px}
  h1{font-size:22px} h2{font-size:15px;margin-top:10px}
  #top{grid-column:1/3;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 14px}
  #top .grp{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  button,select{font:700 12px var(--text);padding:5px 9px;border:2px solid var(--ink);border-radius:6px;background:var(--shade);color:var(--ink);cursor:pointer}
  button:hover:not(:disabled){background:#fff6dc} button:disabled{opacity:.4;cursor:default}
  button.on{background:var(--pin)} button.go{background:var(--stamp);color:#fff6dc}
  label.chk{display:flex;gap:4px;align-items:center;cursor:pointer;font-weight:700}
  #left{grid-row:2/4;overflow:auto}
  #palette{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  #palette button{text-align:left;font-weight:400;padding:4px 7px;line-height:1.25} #palette button b{font-weight:700}
  /* the parts tray (S.5d): little pictures of parts, dragged onto the blueprint (buildTest.js; the pictures are drawn by partArt.js) */
  #tray{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .tile{border:2px solid var(--ink);border-radius:8px;background:#fbf3df;padding:3px 2px 2px;text-align:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:2px 2px 0 rgba(43,34,22,.3)}
  .tile:hover{background:#fff6dc} .tile.on{background:var(--pin)} .tile.none{opacity:.6}
  .tile canvas{width:60px;height:60px;display:block;margin:0 auto;pointer-events:none}
  .tile b{display:block;font-size:10px;line-height:1.15;font-weight:700} .tile i{display:block;font-size:9px;font-style:normal;color:var(--soft)}
  #ghost{position:fixed;left:0;top:0;width:68px;height:68px;pointer-events:none;z-index:60;display:none;opacity:.85;filter:drop-shadow(2px 3px 2px rgba(43,34,22,.45))}
  #ghost.bad{opacity:.55;filter:grayscale(.6) drop-shadow(0 0 3px #a8443f)} #ghost.off{opacity:.4}
  #engBar,#engSelArrows{display:flex;gap:3px;align-items:center;flex-wrap:wrap;margin:4px 0} #engBar button,#engSelArrows button{padding:2px 7px;font-size:16px;line-height:1.1} #engArrows{display:flex;gap:3px} button.cur{background:var(--pin)} #engSel{margin:4px 0;padding:5px 7px;border:2px solid var(--ink);border-radius:8px;background:#fbf3df;font-size:12px}
  details summary{cursor:pointer;font:700 12px var(--text);margin:8px 0 4px}
  #parts{list-style:none;margin:0;padding:0;font-size:12px}
  #parts li{display:flex;justify-content:space-between;gap:6px;padding:2px 3px;border-bottom:1px solid rgba(107,74,50,.18)}
  #parts li.new{background:rgba(201,168,90,.28)} #parts li.sel{outline:2px solid var(--stamp)}
  #parts li button{padding:0 6px;font-size:11px}
  #parts li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #centre{display:flex;flex-direction:column;min-height:0;padding:6px}
  #scene{flex:1;min-height:0;width:100%;border-radius:6px;background:#8fb4d0;cursor:crosshair}
  /* the blueprint editor: cream paper above the live ship (buildTest.js draws it, ink on paper) */
  #bp{flex:2.6;min-height:0;width:100%;border-radius:6px;background:var(--paper);border:2px solid var(--ink);margin-bottom:2px;cursor:crosshair;touch-action:none;display:none}
  .editing #bp{display:block}
  #bpNote{padding:2px 4px 4px;font-size:12px;color:var(--soft);min-height:18px} #bpNote.bad{color:var(--stamp);font-weight:700}
  #hint{padding:3px 4px 0;font-size:12px;color:var(--soft);min-height:18px}
  #bottom{display:grid;grid-template-columns:minmax(560px,1.25fr) 1fr;gap:8px;height:270px}
  #bottom .panel{overflow:auto}
  #gauges{width:100%;height:160px;display:block}
  #live{font-size:12px;color:var(--soft);margin-top:4px}
  .chk-line{display:grid;grid-template-columns:44px 104px 1fr;gap:4px;padding:1px 0;font-size:12px}
  .PASS{color:#3b6b34}.WARN{color:#a5701a}.FAIL{color:var(--stamp);font-weight:700}
  #needs{font-family:var(--display);font-size:14px;margin:2px 0 4px} #needs.ok{color:#3b6b34} #needs.bad{color:var(--stamp)}
  #checklist{display:flex;flex-wrap:wrap;gap:3px 5px;margin:2px 0 6px}
  .chip{font-size:11px;padding:1px 6px;border-radius:9px;border:1px solid rgba(107,74,50,.4)} .chip.done{background:rgba(79,127,63,.2);color:#3b6b34} .chip.todo{background:rgba(168,68,63,.1);color:var(--stamp)} .chip.rec{background:rgba(214,160,58,.18);color:#8a5a00;border-color:rgba(138,90,0,.5)} .chip.opt{color:var(--soft);border-style:dashed}
  #verdict{font-family:var(--display);font-size:16px} #bot{margin-top:6px;border-top:1px dashed var(--soft);padding-top:5px}
</style></head><body>
<div id="app">
  <header id="top" class="panel">
    <h1>Build test</h1>
    <div class="grp"><label class="chk"><input type="checkbox" id="oEdit" checked> Blueprint</label><button id="tDraw" class="on" title="Pencil: drag along a deck row to draw a deck or make one longer">Draw deck</button><button id="tBag" title="Gasbag: drag along the dashed bag row to draw a bag; in empty space beside a bag it adds another; drag a bag's end to resize it">Gasbag</button><button id="tLadder" title="Ladder: drag straight down from one deck to another">Ladder</button><label class="chk" title="Place a one-way slide pole (down only) instead of a ladder"><input type="checkbox" id="oPole"> slide pole</label><button id="tErase" title="Eraser: drag along a deck to rub it out (what stood on it goes too)">Erase</button><button id="tDelete" title="Delete: click any one thing - a ladder, station, gun, rack, sandbag... (right-click works in every tool)">Delete</button><button id="tPlace" title="Click a part in the palette, then a brass pin">Place parts</button><button id="tAim" title="Aim engine: click an engine, then pick an arrow; or drag the brass dot at the tip of its red thrust arrow (any tool)">Aim engine</button>
      <button id="bagShort" title="The biggest gasbag one column shorter">Bag -</button><button id="bagLong" title="The biggest gasbag one column longer (a ship with no bag gets one)">Bag +</button><button id="bagTwin" title="Add or remove the twin envelope on the biggest bag">Twin bag</button></div>
    <div class="grp"><label class="chk"><input type="checkbox" id="oNav"> Nav graph</label><label class="chk"><input type="checkbox" id="oSamples"> Collision samples</label><label class="chk"><input type="checkbox" id="oSlots" checked> Slots</label><label class="chk"><input type="checkbox" id="oBlue"> Blue overlay</label></div>
    <div class="grp"><select id="env"></select><button id="undo">Undo</button><button id="clear" title="Erase the whole ship and start from nothing">Clear (start from nothing)</button><button id="minimal" title="A small flyable ship built with the same tools">Start from a minimal ship</button><button id="reset">Reset to classic</button><button id="copy">Copy build JSON</button><button id="run" class="go">Run 60 s bot test</button></div>
    <div class="grp"><a href="/host.html" style="color:var(--soft)">Back to the game</a></div>
  </header>
  <aside id="left" class="panel">
    <h2 style="margin-top:0">Parts tray</h2>
    <div id="tray"></div>
    <div id="palHint" style="margin:6px 0;color:var(--soft);font-size:12px">Drag a picture onto the blueprint: it snaps to the nearest legal spot (dimmed areas are no good; hover one to see why). Or click a picture, then a brass pin.</div>
    <h2>Engine direction</h2>
    <div id="engBar"><button id="engL" title="Rotate the next engine anticlockwise (also R / mouse wheel while dragging it)">&#10226;</button><span id="engArrows"></span><button id="engR" title="Rotate clockwise (R or the wheel; Shift+R the other way)">&#10227;</button></div>
    <div id="engSel" style="display:none"><b id="engName"></b> <span id="engSay"></span><div id="engSelArrows"></div><label class="chk"><input type="checkbox" id="engSwivel"> swivel mount (a crew station turns it in flight)</label></div>
    <details><summary>Parts by name</summary><div id="palette"></div></details>
    <h2>Placed parts <span id="partCount"></span></h2>
    <ul id="parts"></ul>
  </aside>
  <section id="centre" class="panel editing"><canvas id="bp"></canvas><div id="bpNote"></div><canvas id="scene"></canvas><div id="hint"></div></section>
  <section id="bottom">
    <div class="panel"><canvas id="gauges"></canvas><div id="live"></div></div>
    <div class="panel"><div id="verdict"></div><div id="needs"></div><div id="checklist"></div><div id="report"></div><div id="bot"></div></div>
  </section>
</div>
<canvas id="ghost" width="136" height="136"></canvas>
<script type="module" src="/modules/host/buildTest.js"></script>
</body></html>
