<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Airship Crew - 3D test page</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 3D TEST PAGE: the real 2D simulation, drawn in 3D with Three.js (bundled in vendor/three, MIT licence). Nothing here changes the game. -->
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<style>
  html, body { margin: 0; height: 100%; background: #1b2030; overflow: hidden; font-family: Georgia, 'Times New Roman', serif; color: #2b2622; }
  #stage { position: fixed; inset: 0; display: flex; }
  #c3d, #c2d { display: block; height: 100%; }
  #c3d { flex: 1 1 auto; min-width: 0; }
  #c2d { flex: 0 0 0; width: 0; background: #cfe3ea; }
  body.split #c2d { flex: 0 0 50%; width: 50%; }
  body.only2d #c3d { flex: 0 0 0; width: 0; }
  body.only2d #c2d { flex: 1 1 auto; width: auto; }
  #panel { position: fixed; left: 10px; top: 10px; width: 262px; background: rgba(243,234,214,.93); border: 2px solid #2b2622; border-radius: 10px; padding: 8px 10px 10px; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.35); max-height: calc(100% - 40px); overflow: auto; z-index: 5; }
  #panel h1 { font-size: 15px; margin: 0 0 6px; letter-spacing: .5px; }
  #panel label { display: block; margin: 5px 0 1px; font-weight: bold; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: #6b4a32; }
  #panel select, #panel input[type=number] { width: 100%; font: inherit; padding: 3px; background: #fbf5e6; border: 1.5px solid #6b4a32; border-radius: 5px; }
  #panel .row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
  #panel button { flex: 1 1 auto; font: bold 12px Georgia, serif; padding: 5px 6px; background: #ebdfc0; border: 2px solid #2b2622; border-radius: 6px; cursor: pointer; color: #2b2622; }
  #panel button.on { background: #8fb37a; }
  #panel button:hover { filter: brightness(1.06); }
  #panel small { display: block; margin-top: 6px; color: #6b4a32; line-height: 1.3; }
  #hud { position: fixed; right: 10px; bottom: 8px; z-index: 6; font: bold 14px monospace; color: #fff; background: rgba(0,0,0,.62); padding: 5px 9px; border-radius: 6px; pointer-events: none; text-align: right; white-space: pre; }
  #fallbacks { position: fixed; right: 10px; top: 10px; z-index: 6; max-width: 330px; font: 12px Georgia, serif; color: #2b2622; background: rgba(243,234,214,.9); border: 2px solid #2b2622; border-radius: 8px; padding: 6px 9px; display: none; }
  #title { position: fixed; left: 50%; transform: translateX(-50%); top: 8px; z-index: 6; font: bold 13px Georgia, serif; color: #fff; background: rgba(0,0,0,.45); padding: 3px 12px; border-radius: 12px; pointer-events: none; }
  body.shot #panel, body.shot #hud, body.shot #title { display: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="c3d"></canvas><canvas id="c2d"></canvas></div>
<div id="title">AIRSHIP CREW - 3D test (the same game, drawn in 3D)</div>
<div id="panel"></div>
<div id="fallbacks"></div>
<div id="hud">starting...</div>
<script type="module" src="modules/three3d/main.js"></script>
</body>
</html>
