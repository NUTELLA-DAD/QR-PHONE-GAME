<!doctype html><html><head><meta charset="utf-8"><title>Airship Crew</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
/* Bundled fonts (no internet needed). Limelight = titles/shouts, Libre Baskerville = labels/body. */
@font-face{font-family:'Limelight';src:url(/fonts/Limelight-Regular.ttf) format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Libre Baskerville';src:url(/fonts/LibreBaskerville.ttf) format('truetype');font-weight:400 700;font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:'Libre Baskerville',Georgia,serif;color:#2b2622;background:#f3ead6}
body.play{background:var(--c,#f3ead6)}
.view{display:none;height:100%;padding:20px;flex-direction:column;gap:14px}.show{display:flex}
h1{margin:0;font-size:30px}
input{font:inherit;font-size:22px;padding:12px;border:4px solid #2b2622;border-radius:12px;background:#fff;width:100%;text-transform:none}
#species{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#species button{font-size:34px;padding:8px 0;background:#fff;border:4px solid #2b2622;border-radius:14px}
#species button.on{background:#e63946;transform:translate(0,-3px);box-shadow:0 4px 0 #2b2622}
.big{font:inherit;font-weight:900;font-size:24px;padding:16px;border:5px solid #2b2622;border-radius:16px;background:#e63946;color:#fff;box-shadow:0 5px 0 #2b2622}
#err{color:#b00020;font-weight:700;min-height:20px}
label.opt{display:flex;align-items:center;gap:10px;font-size:18px}
label.opt input{width:28px;height:28px}

/* ---- Play screen: landscape gamepad ---- */
#vplay{padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));gap:6px}
#strip{display:flex;align-items:center;gap:10px;background:#f3ead6;border:4px solid #2b2622;border-radius:14px;padding:4px 8px;min-height:44px}
#me{display:flex;align-items:center;gap:6px;font-weight:900;font-size:18px;white-space:nowrap}
#swatch{width:20px;height:20px;border-radius:50%;border:3px solid #2b2622;background:var(--c,#e63946)}
/* What is in your hands: a big chip with the item's icon (amber when you hold something). */
#carry{display:flex;align-items:center;gap:6px;font-size:18px;font-weight:700;white-space:nowrap;border:3px solid #2b2622;border-radius:12px;padding:0 10px 0 6px;min-height:34px;background:#e6dcc3;color:#6b5a48}
#carry .cico{font-size:26px;line-height:1}
#carry.has{background:#ffd23f;color:#2b2622}
#hull{flex:1;height:18px;border:3px solid #2b2622;border-radius:8px;background:#3b2a1d;position:relative;overflow:hidden;min-width:60px}
#hfill{position:absolute;left:0;top:0;bottom:0;width:100%;background:#4caf50}
#hull span{position:absolute;inset:0;text-align:center;color:#fff;font-size:12px;font-weight:700;line-height:12px}
#leave{font:inherit;font-weight:900;font-size:24px;border:4px solid #2b2622;border-radius:14px;background:#c62828;color:#fff;padding:4px 20px;min-height:44px;min-width:130px;box-shadow:0 4px 0 #2b2622;display:none;touch-action:none}
#leave:active{transform:translateY(3px);box-shadow:0 1px 0 #2b2622}
#info{background:rgba(243,234,214,.9);border:3px solid #2b2622;border-radius:12px;padding:3px 10px;font-size:15px;line-height:1.25;min-height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#info b{font-size:17px}
#info .warn{color:#c62828;font-weight:900}
#controls{flex:1;display:flex;align-items:center;justify-content:space-between;min-height:0}
body.lefty #controls{flex-direction:row-reverse}
#pad{position:relative;border:5px solid #2b2622;border-radius:50%;background:rgba(255,255,255,.35);width:min(36vw,58vh);aspect-ratio:1}
#knob{position:absolute;width:38%;height:38%;left:31%;top:31%;border-radius:50%;background:#f3ead6;border:5px solid #2b2622;box-shadow:0 5px 0 #2b2622}
/* Button sizes follow the height of the control area (--H, set from the real height by ui.js; 66vh until then) so the two columns
   never touch: right = GRAB over ACTION, left = JUMP over ATTACK, and at least --gap between any two buttons. */
#buttons{--H:60vh;--gap:14px;--a:min(calc(var(--H) * .55),160px);--g:min(calc(var(--H) * .34),88px);--k:min(calc(var(--H) * .5),124px);--j:min(calc(var(--H) * .34),88px);position:relative;width:min(54vw,92vh);height:100%}
.btn{position:absolute;border:5px solid #2b2622;border-radius:50%;color:#fff;font:inherit;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.05;box-shadow:0 6px 0 #2b2622;padding:6px}
.btn .ic{font-size:2.3em;line-height:1}
.btn .tx{max-width:92%;overflow-wrap:anywhere}
.btn.down{transform:translateY(5px);box-shadow:0 1px 0 #2b2622;filter:brightness(.9)}
/* Middle column between the stick and the buttons: the radar and/or the job arrow for idle crew. */
#mid{display:none;flex:1;min-width:0;align-self:stretch;margin:0 4px;flex-direction:column;align-items:center;justify-content:center;gap:4px}
#mid.on{display:flex}
#radarbox{display:none;flex:1 1 0;min-height:0;width:100%;align-items:center;justify-content:center}
#mid.rd #radarbox{display:flex}
#radar{display:block;touch-action:none;border-radius:50%}
/* With the radar showing, the job arrow shrinks to one line under it. */
#mid.rd #job{flex:none;width:100%;flex-direction:row;gap:6px;padding:2px 6px;border-width:3px;border-radius:12px}
#mid.rd #jarrow{font-size:20px}
#mid.rd #jtext{font-size:12px}
/* The right-hand buttons only need their own width unless the helm levers are out (leaves room for the radar). */
body:not(.helm) #buttons{width:calc(var(--a) + var(--k) + var(--gap))}
#help{font:inherit;font-weight:900;font-size:17px;border:4px solid #2b2622;border-radius:14px;background:#e63946;color:#fff;padding:2px 12px;min-height:44px;min-width:92px;box-shadow:0 3px 0 #2b2622;touch-action:none;white-space:nowrap}
#help.down{transform:translateY(3px);box-shadow:0 0 0 #2b2622}
#help.wait{background:#7d6a5a;color:#e6d9c0}
/* PRIME (left button while on a gun): fills up as you hold it, glows when ready. */
#atk.prime{background:linear-gradient(to top,#ff8c1a var(--p,0%),#3a5a8c var(--p,0%));transition:none}
#atk.prime.ready{background:#ffb347;color:#2b2622;animation:primed .5s ease-in-out infinite alternate}
@keyframes primed{from{box-shadow:0 6px 0 #2b2622,0 0 10px 2px #ffd23f}to{box-shadow:0 6px 0 #2b2622,0 0 26px 10px #fff2b0}}
#job{display:none;flex:1;min-width:0;align-self:center;width:100%;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 8px;background:#2b2622;color:#ffd23f;border:4px solid #f3ead6;border-radius:16px;text-align:center;font-weight:900;pointer-events:none}
#job.show{display:flex}
#jarrow{font-size:min(24vh,104px);line-height:1}
#jtext{font-size:clamp(14px,4.4vh,22px);line-height:1.1;overflow-wrap:anywhere}
/* Action (uses what you hold): biggest, lower right. Attack: to its left. GRAB (take / swap / hop on a seat): small amber
   square at the top right, well off the thumb's resting place. JUMP: top left of the cluster, above Attack. */
#act{width:var(--a);height:var(--a);right:0;bottom:0;background:#f3ead6;color:#2b2622;font-size:clamp(14px,4vh,20px)}
#atk{width:var(--k);height:var(--k);right:calc(var(--a) + var(--gap));bottom:0;background:#3a5a8c;font-size:clamp(13px,3.6vh,18px)}
#jump{width:var(--j);height:var(--j);right:calc(var(--a) + var(--gap) + (var(--k) - var(--j)) / 2);top:0;background:#2e8b57;font-size:clamp(12px,3.2vh,17px)}
#grab{width:var(--g);height:var(--g);right:0;top:0;border-radius:24%;background:#f2b134;color:#2b2622;font-size:clamp(9px,2.5vh,13px);padding:3px;gap:1px}
#grab .ic{font-size:1.6em}
#grab .tx{line-height:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
body.lefty #act{right:auto;left:0}
body.lefty #atk{right:auto;left:calc(var(--a) + var(--gap))}
body.lefty #jump{right:auto;left:calc(var(--a) + var(--gap) + (var(--k) - var(--j)) / 2)}
body.lefty #grab{right:auto;left:0}
/* COME ABOUT (the helm only, where GRAB sits): hold it and the ring fills; the host turns the ship round when it is full. Greyed while she is turning. */
#turn{width:var(--g);height:var(--g);right:0;top:0;background:conic-gradient(#ffd23f var(--p,0%),#6b4a8c 0);font-size:clamp(9px,2.4vh,12px);padding:3px;gap:1px;display:none;touch-action:none}
#turn .ic{font-size:1.5em}
#turn .tx{line-height:1;max-width:90%}
body.helm #turn{display:flex}
body.lefty #turn{right:auto;left:0}
#turn.busy{filter:grayscale(.8) brightness(.9);opacity:.6}
/* Hold-to-swap on GRAB fills like a loading Action button; just after a grab it is greyed (the host ignores it for a moment). */
#grab.loading{background:linear-gradient(to top,#ff8c1a var(--p,0%),#f2b134 var(--p,0%))}
#grab.swap::after{content:'HOLD';font-size:10px;background:#2b2622;color:#ffd23f;border-radius:8px;padding:0 6px;line-height:1.3}
#grab.lock{filter:grayscale(.8) brightness(.9);opacity:.6}
#act.loading{background:linear-gradient(to top,#ff8c1a var(--p,0%),#f1e2b8 var(--p,0%))}
/* Nothing to use right now: greyed (it says what is in hand, e.g. "Hammer ready"). */
#act.idle{background:#cfc6b0;color:#6b5a48;box-shadow:0 6px 0 #6b5a48}
/* Hold actions: a dashed ring and a clear HOLD pill; the button fills as the job progresses. */
#act.hold{outline:4px dashed #ff8c1a;outline-offset:4px}
#act.hold::after{content:'HOLD';font-size:13px;background:#2b2622;color:#ffd23f;border-radius:10px;padding:0 9px;line-height:1.35;margin-top:2px}
#act.nudge{animation:nudge .5s}
#act.nudge::after{background:#c62828;color:#fff;content:'KEEP HOLDING!'}
@keyframes nudge{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}50%{transform:translateX(7px)}80%{transform:translateX(-4px)}}
/* The item in your hands, on the corner of the big button. */
#act .held{position:absolute;top:-6px;left:-6px;width:38px;height:38px;border-radius:50%;background:#ffd23f;border:4px solid #2b2622;font-size:21px;line-height:30px;display:none}
#act.has .held{display:block}
body.lefty #act .held{left:auto;right:-6px}
/* Helm throttle lever (replaces Attack while steering). */
#lever{position:absolute;right:calc(var(--a) + 10px);top:0;width:min(20vh,84px);height:100%;border:5px solid #2b2622;border-radius:18px;background:#3b2a1d;display:none;touch-action:none}
body.lefty #lever{right:auto;left:calc(var(--a) + 10px)}
#lever .fill{position:absolute;left:0;right:0;bottom:0;background:#4caf50}
#lever .stop{position:absolute;left:-4px;right:-4px;height:4px;margin-bottom:-2px;background:#ffd23f}
#lever .rev{position:absolute;left:0;right:0;bottom:4px;text-align:center;color:#ff8a8a;font-size:11px;font-weight:900}
#lever .handle{position:absolute;left:-8px;right:-8px;height:30px;margin-top:-15px;background:#f3ead6;border:5px solid #2b2622;border-radius:10px}
#plever{position:absolute;right:calc(var(--a) + min(20vh,84px) + 20px);top:0;width:min(20vh,84px);height:100%;border:5px solid #2b2622;border-radius:18px;background:#3b2a1d;display:none;touch-action:none}
body.lefty #plever{right:auto;left:calc(var(--a) + min(20vh,84px) + 20px)}
#plever .fill{position:absolute;left:0;right:0;bottom:50%}
#plever .mid{position:absolute;left:-4px;right:-4px;top:50%;height:4px;margin-top:-2px;background:#ffd23f}
#plever .handle{position:absolute;left:-8px;right:-8px;height:30px;margin-top:-15px;background:#f3ead6;border:5px solid #2b2622;border-radius:10px}
#plever .tag{position:absolute;left:0;right:0;top:-2px;text-align:center;color:#fff;font-size:12px;font-weight:900}
#plever .rev{position:absolute;left:0;right:0;bottom:4px;text-align:center;color:#8ab8ff;font-size:11px;font-weight:900}
#lever .tag{position:absolute;left:0;right:0;top:-2px;text-align:center;color:#fff;font-size:12px;font-weight:900}
/* Upgrade vote: three big cards over everything. */
#vote{display:none;position:fixed;inset:0;background:rgba(43,38,34,.92);z-index:8;flex-direction:column;padding:10px;gap:8px}
#vote h2{margin:0;color:#f3ead6;font-size:22px;text-align:center}
#vote .cards{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));grid-auto-rows:minmax(110px,1fr);gap:10px;min-height:0;overflow-y:auto;touch-action:pan-y}
#vote .cards.route{grid-template-columns:1fr}
#vote button{min-height:110px;font:inherit;border:5px solid #2b2622;border-radius:16px;background:#f3ead6;color:#2b2622;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;box-shadow:0 5px 0 #000}
#vote button .ic{font-size:38px}
#vote button em{font-style:normal;font-weight:900;font-size:17px;color:#7a4a00}
#vote button.off{opacity:.4;background:#cdbf9a}
#vote button.cast{background:#cfe3b8;grid-column:1/-1}
#vote button b{font-size:19px}
#vote button small{font-size:14px;line-height:1.2}
#vote button.on{background:#ffd23f;transform:translateY(-3px);outline:5px solid #fff}
#toast{display:none;position:fixed;left:50%;top:22%;transform:translateX(-50%);background:#ffd23f;color:#2b2622;border:5px solid #2b2622;border-radius:16px;padding:10px 18px;font-size:24px;font-weight:900;z-index:7;box-shadow:0 5px 0 #2b2622;pointer-events:none;white-space:nowrap}
#rotate{display:none;position:fixed;inset:0;background:#2b2622;color:#f3ead6;font-size:24px;font-weight:900;text-align:center;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:9}
#rotate .ic{font-size:70px}
@media (orientation:portrait){body.play #rotate{display:flex}}
/* ---- Captain's logbook look (matches the TV): Limelight for titles and shouts, cream paper, warm-brown ink. ---- */
h1,.big,#leave,#help,#toast,#vote h2,#vote button em,#rotate,#job,#code{font-family:'Limelight',Georgia,serif;font-weight:400}
h1{font-size:28px}
.big{font-size:22px}
#leave{font-size:21px}
#help{font-size:15px}
#toast{font-size:21px}
#vote h2{font-size:20px}
#vote button em{font-size:16px}
#rotate{font-size:22px}
#jtext{font-size:clamp(13px,4vh,20px)}
#mid.rd #jtext{font-size:11px}
#strip,#info{box-shadow:inset 0 0 0 2px #f3ead6,inset 0 0 0 3px rgba(107,74,50,.4)}
#vote button{box-shadow:0 5px 0 #000,inset 0 0 0 2px #f3ead6,inset 0 0 0 3px rgba(107,74,50,.4)}
#vote button.on{box-shadow:0 5px 0 #000}
#me{font-weight:700}
#info b{font-weight:700}
#info .warn{color:#a8443f}
#me{min-width:0}
#myname{max-width:90px;overflow:hidden;text-overflow:ellipsis}
#carry{min-width:0;flex:0 1 auto;overflow:hidden}
#carrytx{overflow:hidden;text-overflow:ellipsis}
/* Narrow phones: keep the top strip on ONE line even with LEAVE showing (the button area below is sized from what is left). */
@media (max-width:660px){#carry{font-size:15px;padding:0 6px 0 4px}#carry .cico{font-size:22px}#leave{min-width:96px;padding:2px 10px;font-size:17px;min-height:40px}#help{min-width:76px;padding:2px 8px}#strip{gap:6px}}
</style></head><body>
<div id="vjoin" class="view show">
  <h1>Join the crew</h1>
  <input id="code" placeholder="Room code" maxlength="4" autocapitalize="characters" autocomplete="off">
  <input id="name" placeholder="Your name" maxlength="12" autocomplete="off">
  <div id="species"></div>
  <label class="opt"><input type="checkbox" id="lefty"> Left-handed (joystick on the right)</label>
  <div id="err"></div>
  <button class="big" id="go">Climb aboard</button>
</div>
<div id="vplay" class="view">
  <div id="strip">
    <div id="me"><div id="swatch"></div><span id="myname">Crew</span></div>
    <div id="carry"><span class="cico">✋</span><span id="carrytx">Hands empty</span></div>
    <div id="hull"><div id="hfill"></div><span>HULL</span></div>
    <button id="help">🆘 Help!</button>
    <button id="leave">⬅ LEAVE</button>
  </div>
  <div id="info"><b>Walking</b> - walk to a station, rack, fire or hole</div>
  <div id="controls">
    <div id="pad"><div id="knob"></div></div>
    <div id="mid">
      <div id="radarbox"><canvas id="radar"></canvas></div>
      <div id="job"><div id="jarrow"></div><div id="jtext"></div></div>
    </div>
    <div id="buttons">
      <div id="plever"><div class="fill"></div><div class="mid"></div><div class="tag">PUMP ▲</div><div class="rev">VENT ▼</div><div class="handle"></div></div>
      <div id="lever"><div class="fill"></div><div class="stop"></div><div class="tag">AHEAD</div><div class="rev">REVERSE</div><div class="handle"></div></div>
      <button class="btn" id="jump"><span class="ic">⤴️</span><span class="tx">JUMP</span></button>
      <button class="btn" id="atk"><span class="ic">✋</span><span class="tx">Shove</span></button>
      <button class="btn" id="turn"><span class="ic">🔄</span><span class="tx">COME ABOUT</span></button>
      <button class="btn" id="grab" style="display:none"><span class="ic">🤲</span><span class="tx">Grab</span></button>
      <button class="btn idle" id="act"><span class="held" id="held"></span><span class="ic">👋</span><span class="tx">Hey!</span></button>
    </div>
  </div>
</div>
<div id="vote"><h2 id="vtitle">Pick an upgrade</h2><div class="cards" id="vcards"></div></div>
<div id="toast"></div>
<div id="rotate"><div class="ic">📱↻</div>Turn your phone sideways</div>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/modules/controller/main.js"></script>
</body></html>
